[project]
name = "steward"
version = "0.1.0"
description = "Steward — a governed metadata-remediation agent for DataHub. Detects metadata debt, drafts fixes, judge-gates every write, and keeps receipts."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "mcp>=1.0.0",
    "mcp-server-datahub>=0.1.0",
    "pydantic>=2.0",
]

[project.scripts]
steward = "steward.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
